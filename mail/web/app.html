<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBG Mail</title>
  <meta name="description" content="PBG Officials webmail — manage your @pbgofficials.dev mailbox">
  <link rel="icon" href="https://pbgofficials.dev/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="app-layout" id="appLayout">
    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="url(#hg)"/>
          <path d="M8 14L20 22L32 14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 14V26C8 27.1 8.9 28 10 28H30C31.1 28 32 27.1 32 26V14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="hg" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
        </svg>
        <span class="header-logo-text">PBG Mail</span>
      </div>

      <div class="header-search">
        <svg class="header-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search emails…" aria-label="Search emails">
      </div>

      <div class="header-actions">
        <button class="header-btn" id="refreshBtn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        </button>
        <div class="user-avatar" id="userAvatar" title="Account"></div>
      </div>

      <!-- User dropdown -->
      <div class="user-dropdown" id="userDropdown">
        <div class="user-dropdown-header">
          <div class="user-dropdown-name" id="dropdownName"></div>
          <div class="user-dropdown-email" id="dropdownEmail"></div>
        </div>
        <button class="user-dropdown-item" id="adminBtn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Admin Panel
        </button>
        <button class="user-dropdown-item danger" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <button class="compose-btn" id="composeBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Compose
      </button>

      <ul class="folder-list" id="folderList">
        <li class="folder-item active" data-folder="inbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
          <span class="folder-label">Inbox</span>
          <span class="folder-badge" id="badge-inbox"></span>
        </li>
        <li class="folder-item" data-folder="starred">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span class="folder-label">Starred</span>
          <span class="folder-badge" id="badge-starred"></span>
        </li>
        <li class="folder-item" data-folder="sent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span class="folder-label">Sent</span>
          <span class="folder-badge" id="badge-sent"></span>
        </li>
        <li class="folder-item" data-folder="drafts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span class="folder-label">Drafts</span>
          <span class="folder-badge" id="badge-drafts"></span>
        </li>

        <li class="sidebar-divider" role="separator"></li>

        <li class="folder-item" data-folder="spam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
          <span class="folder-label">Spam</span>
          <span class="folder-badge" id="badge-spam"></span>
        </li>
        <li class="folder-item" data-folder="trash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          <span class="folder-label">Trash</span>
          <span class="folder-badge" id="badge-trash"></span>
        </li>
        <li class="folder-item" data-folder="archive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
          <span class="folder-label">Archive</span>
          <span class="folder-badge" id="badge-archive"></span>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="storage-bar"><div class="storage-fill" id="storageFill" style="width:0%"></div></div>
        <div class="storage-text" id="storageText">0 MB of 500 MB used</div>
      </div>
    </aside>

    <!-- ===== EMAIL LIST PANE ===== -->
    <section class="email-list-pane">
      <div class="email-list-toolbar">
        <input type="checkbox" class="toolbar-checkbox" id="selectAll" title="Select all">
        <button class="toolbar-btn" id="toolbarArchive" title="Archive" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/></svg>
        </button>
        <button class="toolbar-btn" id="toolbarTrash" title="Delete" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
        <button class="toolbar-btn" id="toolbarSpam" title="Report spam" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        </button>
        <button class="toolbar-btn" id="toolbarRead" title="Mark as read" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </button>
        <span class="toolbar-spacer"></span>
        <span class="toolbar-page-info" id="pageInfo"></span>
        <button class="toolbar-btn" id="prevPage" title="Previous page" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="toolbar-btn" id="nextPage" title="Next page" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="email-list" id="emailList">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- ===== READING PANE ===== -->
    <section class="reading-pane" id="readingPane">
      <div class="reading-empty" id="readingEmpty">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <h2>Select an email to read</h2>
        <p>Choose an email from the list on the left</p>
      </div>
      <div class="email-view" id="emailView" hidden>
        <!-- Populated by JS when an email is selected -->
      </div>
    </section>
  </div>

  <!-- ===== COMPOSE MODAL ===== -->
  <div class="compose-overlay" id="composeOverlay">
    <div class="compose-window">
      <div class="compose-header">
        <span class="compose-title" id="composeTitle">New Message</span>
        <button class="compose-close" id="composeClose" title="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="compose-fields">
        <div class="compose-field">
          <span class="compose-field-label">To</span>
          <input type="text" id="composeTo" placeholder="recipient@example.com">
          <span class="compose-toggle-cc" id="toggleCcBcc">Cc/Bcc</span>
        </div>
        <div class="compose-field" id="ccField" hidden>
          <span class="compose-field-label">Cc</span>
          <input type="text" id="composeCc" placeholder="cc@example.com">
        </div>
        <div class="compose-field" id="bccField" hidden>
          <span class="compose-field-label">Bcc</span>
          <input type="text" id="composeBcc" placeholder="bcc@example.com">
        </div>
        <div class="compose-field">
          <span class="compose-field-label">Subject</span>
          <input type="text" id="composeSubject" placeholder="Subject">
        </div>
      </div>
      <div class="compose-body">
        <div contenteditable="true" id="composeBody" data-placeholder="Write your message…"></div>
      </div>
      <div class="compose-attachments" id="composeAttachments"></div>
      <div class="compose-footer">
        <button class="compose-send-btn" id="composeSendBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send
        </button>
        <span class="toolbar-spacer"></span>
        <button class="compose-toolbar-btn" id="composeSaveDraft" title="Save draft">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
        <label class="compose-toolbar-btn" title="Attach file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          <input type="file" id="composeFileInput" multiple hidden>
        </label>
        <button class="compose-toolbar-btn" id="composeDiscard" title="Discard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
