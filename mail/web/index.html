<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBG Mail — Sign In</title>
  <meta name="description" content="PBG Officials secure webmail — sign in to your @pbgofficials.dev mailbox">
  <link rel="icon" href="https://pbgofficials.dev/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <!-- Ambient background -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <main class="login-container">
    <div class="login-card" id="loginCard">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="url(#grad)"/>
            <path d="M8 14L20 22L32 14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 14V26C8 27.1 8.9 28 10 28H30C31.1 28 32 27.1 32 26V14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40">
                <stop stop-color="#8b5cf6"/>
                <stop offset="1" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>PBG Mail</h1>
        <p class="login-subtitle">Sign in to your @pbgofficials.dev mailbox</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" autocomplete="on">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="text" id="loginEmail" name="email" placeholder="support" required autocomplete="username">
            <span class="input-suffix">@pbgofficials.dev</span>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-error" id="loginError" role="alert"></div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loading" hidden>
            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4" stroke-dashoffset="10"/>
            </svg>
          </span>
        </button>
      </form>

      <div class="login-footer">
        <p>Secured by PBG Officials</p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = ''; // Same origin — worker serves both API and pages

    // Check if already logged in
    const token = localStorage.getItem('pbg_mail_token');
    if (token) {
      window.location.href = '/app.html';
    }

    // Password toggle
    document.getElementById('passwordToggle').addEventListener('click', () => {
      const input = document.getElementById('loginPassword');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('loginError');
      const emailInput = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      error.textContent = '';
      error.classList.remove('visible');
      btn.querySelector('.btn-text').hidden = true;
      btn.querySelector('.btn-loading').hidden = false;
      btn.disabled = true;

      try {
        const address = emailInput.includes('@') ? emailInput : `${emailInput}@pbgofficials.dev`;

        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        localStorage.setItem('pbg_mail_token', data.token);
        localStorage.setItem('pbg_mail_account', JSON.stringify(data.account));

        // Smooth transition
        document.getElementById('loginCard').classList.add('login-success');
        setTimeout(() => {
          window.location.href = '/app.html';
        }, 400);

      } catch (err) {
        error.textContent = err.message;
        error.classList.add('visible');
      } finally {
        btn.querySelector('.btn-text').hidden = false;
        btn.querySelector('.btn-loading').hidden = true;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
